name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-build-*'
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run desktop:prepare
      - run: npx playwright install chromium
      - run: npm test
      - name: Check CI diagnostics
        run: node --test tests-ci/desktop-summary.test.mjs
      - name: Run desktop tests
        run: npm run test:desktop -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: desktop-test-results/results.json
      - name: Summarize desktop failures
        if: always()
        run: node scripts/summarize-desktop-results.mjs desktop-test-results/results.json
      - run: npm run desktop:dist -- --win --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npx playwright test -c playwright.packaged.config.ts
      - name: Hash Windows installers
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $packageHash = Get-FileHash $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $packageHash.Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Xumu-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-results
          path: |
            test-results
            desktop-test-results
          if-no-files-found: ignore
